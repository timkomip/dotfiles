# config/packages.conf
# Declarative package list for `dotty packages`.
# Format: <manager> <package> [flags...]   (# comments and blank lines ignored)
#   Anything after the package name is passed straight to the install command,
#   e.g. "snap nvim --classic" runs `snap install nvim --classic`.
# Manager tokens:
#   mac_<mgr>  — run only on macOS (e.g. mac_brew; brew also exists on Linux but
#                we don't want brew packages there)
#   <mgr>      — run wherever that manager's command is available (apt, snap)
# Tools without a package-manager entry (mise, bat shim) live in custom-installs.zsh.

# macOS — Homebrew
mac_brew fzf
mac_brew gh
mac_brew htop
mac_brew bat
mac_brew lazygit
mac_brew mise
mac_brew jq
mac_brew yq
mac_brew neovim
mac_brew zoxide

# Debian/Ubuntu — apt
apt  git
apt  fzf
apt  htop
apt  bat
apt  jq

# Debian/Ubuntu — snap
snap yq
snap gh
snap lazygit
snap nvim --classic
